  <script>

    (function(){

        if (now > expiry) {
          document.body.innerHTML = `

      // 우클릭 방지
      document.addEventListener('contextmenu', e => e.preventDefault());

      document.addEventListener('keydown', e => {
        if (e.key === 'F12' ||

      // 드래그 방지
      document.addEventListener('dragstart', e => e.preventDefault());
      
      // 텍스트 선택 방지 강화

      if (!checkLicense()) return;
      
      // 메인 애플리케이션 시작
      setTimeout(initializeApp, 100);

    // 암호화된 변수들
    let _0x4d8a = {
      sortType: 'volume',
      timeframe: 3,
      coins: [],
      displayCoins: [],
      analyzedCoins: [],
      analyzedCount: 0,
      isAnalyzing: false,
      searchQuery: '',
      selectedCoin: null,
      searchTimer: null,
      updateQueue: [],
      currentIndex: 0
    };
    
    const _0x5f2c = ['USDT','USDC','BUSD','DAI','TUSD','USDP','GUSD','USDD'];
    
    // 메인 초기화 함수
    async function initializeApp() {
      try {
        console.log('시스템 초기화 시작...');
        
        createLoadingPlaceholders();
        await loadCoinsData();
        startContinuousAnalysis();

    }

    // 로딩 플레이스홀더 생성
    function createLoadingPlaceholders() {
      const grid = document.getElementById('coins-grid');
      grid.innerHTML = '';
      
      for (let i = 0; i < 12; i++) {
        const placeholder = document.createElement('div');
        placeholder.className = 'loading-placeholder';
        placeholder.id = `placeholder-${i}`;
        placeholder.innerHTML = `
          <div class="spinner"></div>
          <div>코인 ${i + 1} 분석 대기 중...</div>
        `;
        grid.appendChild(placeholder);
      }
    }

    // 코인 데이터 로드
    async function loadCoinsData() {
      try {
        const response = await fetch('https://api.upbit.com/v1/market/all?isDetails=false');
        const markets = await response.json();
        
        const krwMarkets = markets.filter(m => {
          const isKRW = m.market.startsWith('KRW-');
          const symbol = m.market.replace('KRW-', '');
          return isKRW && !_0x5f2c.includes(symbol);
        });
        
        const tickerResponse = await fetch(`https://api.upbit.com/v1/ticker?markets=${krwMarkets.map(m => m.market).join(',')}`);
        const tickers = await tickerResponse.json();
        
        _0x4d8a.coins = krwMarkets.map(market => {
          const ticker = tickers.find(t => t.market === market.market);
          return { ...market, ...ticker };
        }).filter(coin => coin.trade_price);
        
        updateDisplayCoins();
        console.log(`총 ${_0x4d8a.coins.length}개 코인 로드 완료`);
        
      } catch (error) {
        console.error('코인 데이터 로드 실패:', error);
        throw error;
      }
    }

    // 표시할 코인 업데이트
    function updateDisplayCoins() {
      let coins = [..._0x4d8a.coins];
      
      if (_0x4d8a.searchQuery) {
        coins = coins.filter(coin => 
          coin.korean_name?.toLowerCase().includes(_0x4d8a.searchQuery.toLowerCase()) ||
          coin.market.replace('KRW-', '').toLowerCase().includes(_0x4d8a.searchQuery.toLowerCase())
        );
      }
      
      if (_0x4d8a.sortType === 'volume') {
        coins.sort((a, b) => (b.acc_trade_price_24h || 0) - (a.acc_trade_price_24h || 0));
      } else {
        coins.sort((a, b) => (b.signed_change_rate || 0) - (a.signed_change_rate || 0));
      }
      
      _0x4d8a.displayCoins = coins.slice(0, 12);
      _0x4d8a.updateQueue = [..._0x4d8a.displayCoins];
      _0x4d8a.currentIndex = 0;
    }

    // 지속적 순차 분석 시작
    function startContinuousAnalysis() {
      if (_0x4d8a.isAnalyzing) return;
      _0x4d8a.isAnalyzing = true;
      
      document.getElementById('loading-counter').style.display = 'block';
      updateProgress(0);
      
      processCoinQueue();
    }

    // 코인 큐 처리 (순차적 지속 업데이트)
    async function processCoinQueue() {
      if (_0x4d8a.updateQueue.length === 0) {
        // 큐가 비었으면 다시 채우고 계속
        _0x4d8a.updateQueue = [..._0x4d8a.displayCoins];
        _0x4d8a.currentIndex = 0;
        
        // 5초 후 다음 라운드 시작 (느린 지속 업데이트)
        setTimeout(() => {
          if (_0x4d8a.isAnalyzing) processCoinQueue();
        }, 5000);
        return;

    // 기술적 지표 계산 함수들
    function calculateRSI(prices, period = 14) {
      if (prices.length < period + 1) return 50;
      let gains = 0, losses = 0;
      for (let i = 1; i <= period; i++) {
        const change = prices[i] - prices[i - 1];
        if (change > 0) gains += change;
        else losses -= change;
      }
      gains /= period;
      losses /= period;
      if (losses === 0) return 100;
      return 100 - (100 / (1 + gains / losses));
    }

    function calculateCCI(closes, highs, lows, period = 20) {
      if (closes.length < period) return 0;
      const typicalPrices = closes.map((c, i) => (highs[i] + lows[i] + c) / 3);
      const recent = typicalPrices.slice(-period);
      const sma = recent.reduce((sum, tp) => sum + tp, 0) / period;
      const meanDeviation = recent.reduce((sum, tp) => sum + Math.abs(tp - sma), 0) / period;
      if (meanDeviation === 0) return 0;
      return (typicalPrices[typicalPrices.length - 1] - sma) / (0.015 * meanDeviation);
    }

    function calculateBollingerBands(prices, period = 20, stdDev = 2) {
      if (prices.length < period) return { upper: 0, middle: 0, lower: 0, percent: 0.5 };
      const recent = prices.slice(-period);
      const sma = recent.reduce((sum, p) => sum + p, 0) / period;
      const variance = recent.reduce((sum, p) => sum + Math.pow(p - sma, 2), 0) / period;
      const std = Math.sqrt(variance);
      const upper = sma + (std * stdDev);
      const lower = sma - (std * stdDev);
      const currentPrice = prices[prices.length - 1];
      return {
        upper, middle: sma, lower,
        percent: upper !== lower ? (currentPrice - lower) / (upper - lower) : 0.5
      };
    }

    function calculateSmartRangeSimple(candles) {
      if (candles.length < 20) return 50;
      const recent = candles.slice(-20);
      const closes = recent.map(c => c.trade_price);
      const highs = recent.map(c => c.high_price);
      const lows = recent.map(c => c.low_price);
      const currentPrice = closes[closes.length - 1];
      const highestHigh = Math.max(...highs);
      const lowestLow = Math.min(...lows);
      const rangePosition = (currentPrice - lowestLow) / (highestHigh - lowestLow);
      const volatility = (highestHigh - lowestLow) / currentPrice;
      const recentTrend = (closes[closes.length - 1] - closes[closes.length - 5]) / closes[closes.length - 5];
      let score = 50;
      if (rangePosition <= 0.2) score += 30;
      else if (rangePosition <= 0.3) score += 20;
      else if (rangePosition >= 0.8) score -= 30;
      else if (rangePosition >= 0.7) score -= 20;
      if (recentTrend > 0.02) score += 15;
      else if (recentTrend < -0.02) score -= 15;
      if (volatility > 0.05 && volatility < 0.15) score += 10;
      return Math.max(0, Math.min(100, score));
    }

    function updateProgress(percent) {
      document.getElementById('progress-bar').style.width = `${percent}%`;
    }

    function updateCounter(current, total) {
      document.getElementById('counter').textContent = `${current}/${total}`;
    }

    function showError(message) {
      const grid = document.getElementById('coins-grid');
      grid.innerHTML = `
        <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--strong-sell);">
          <i class="fas fa-exclamation-triangle" style="font-size: 3rem; margin-bottom: 20px;"></i>
          <div>${message}</div>
          <button class="btn" onclick="location.reload()" style="margin-top: 20px;">새로고침</button>
        </div>
      `;
    }

    // 콘솔 로그 숨김
    console.log = console.warn = console.error = () => {};
    
    // 추가 보안
    setInterval(() => {
      const now = new Date();
      if (now.getFullYear() === 2025 && now.getMonth() >= 9) {
        document.body.innerHTML = '<div class="license-expired"><h1>사용 기간 만료</h1></div>';
      }
    }, 60000);
  </script>
</body>
</html>
